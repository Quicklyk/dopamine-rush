*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overscroll-behavior:none;background:#120c22;color:#fff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom))*9/16));height:min(calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)),calc(100vw*16/9));overflow:hidden;background:#1a1233}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.ov{position:absolute;inset:0;background:rgba(14,8,30,.84);display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:56px 14px 18px;overflow-y:auto;text-align:center;z-index:3}
.ov.title{background:linear-gradient(rgba(18,10,38,.55),rgba(18,10,38,.92) 55%)}
.hide{display:none!important}
button{font:inherit;cursor:pointer;color:#fff}
.btn{background:#ff4fa3;border:0;border-bottom:4px solid #b3246d;font-weight:800;font-size:17px;padding:12px 24px;border-radius:8px;min-height:44px}
.btn.sub{background:#3a2f63;border-bottom-color:#241c40;font-size:14px;padding:10px 14px}
.btn.big{font-size:20px;padding:14px 40px}
.btn.stop{background:#ffd23f;border-bottom-color:#b38f12;color:#2a1650;font-size:22px;padding:14px 46px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{opacity:.4}
.btn:focus-visible,.card:focus-visible,.upg:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
.ttl{font-size:22px;font-weight:900;line-height:1.2}
.msg{font-size:15px;line-height:1.5;color:#efe8ff}
.gold{font-size:16px;font-weight:800;color:#ffd54a}
.card{position:relative;display:flex;align-items:center;gap:10px;width:100%;max-width:330px;background:#241a45;border:3px solid #777;border-radius:10px;padding:10px;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.card:disabled{opacity:.35}
.card .ic{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px;background:#140d2b;border-radius:8px}
.card .ic canvas{width:48px;height:48px;image-rendering:pixelated}
.card b{display:block;font-size:16px;line-height:1.25}
.card small{display:block;font-size:13px;color:#d4cbf3;margin-top:2px;line-height:1.35}
.card .new{position:absolute;top:-9px;right:10px;background:#ff4fa3;color:#fff;font-size:11px;font-weight:900;padding:2px 7px;border-radius:10px}
.rar{font-size:12px;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.reels{display:flex;gap:8px}
.reels span{background:#0c0820;border:3px solid #ffd23f;border-radius:10px;width:72px;height:72px;display:flex;align-items:center;justify-content:center;font-size:38px}
.reels span.held{border-color:#ff4fa3;box-shadow:0 0 0 3px rgba(255,79,163,.4)}
.wheel{background:#0c0820;border:3px solid #ffd23f;border-radius:12px;padding:14px 18px;font-size:22px;font-weight:900;min-width:220px}
.odds{font-size:12px;color:#b9aee0;max-width:320px;line-height:1.5}
.logo{font-size:60px;font-weight:900;line-height:.95;color:#ff4fa3;text-shadow:0 4px 0 #6a1f9a,0 8px 0 #2a0f45;letter-spacing:-1px;margin-top:10px}
.sub{font-size:14px;color:#d7ccff}
.stat{font-size:15px;font-weight:800;color:#ffd54a;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:20px}
.sec{font-size:14px;font-weight:800;color:#ff9ad5;margin-top:8px}
.upg{display:grid;grid-template-columns:1fr auto;gap:0 8px;width:100%;max-width:330px;background:#241a45;border:2px solid #4a3a80;border-radius:10px;padding:8px 12px;text-align:left;min-height:44px}
.upg b{font-size:14px}.upg b span{color:#b9aee0;font-weight:600;font-size:12px}
.upg small{grid-column:1;color:#cfc6ef;font-size:12px}
.upg i{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-weight:800;color:#ff9ad5}
.upg:disabled{opacity:.5}
.ov.top{justify-content:flex-start;padding-top:64px}
.big2{font-size:18px;font-weight:900;color:#ff9ad5}
.wheel{font-size:26px;min-width:260px;padding:18px 20px}
.ov.title .logo{font-size:48px;margin-top:0}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:340px}
.ugrid .upg{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;max-width:none}
.ugrid .upg i{align-self:stretch;text-align:right}
.hot{color:#ffd23f;animation:blink .5s infinite alternate;display:inline-block}
@keyframes blink{to{opacity:.35}}
.logo2{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px}
.lrow{display:flex;gap:4px}
.tile{position:relative;width:34px;height:46px;border-radius:7px;background:linear-gradient(#2a1650,#120a24);border:2px solid #ffd23f;box-shadow:0 3px 0 #8a6a00,inset 0 0 10px rgba(255,79,163,.35);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Bungee',system-ui,sans-serif;font-size:28px;line-height:1}
.tile b{background:linear-gradient(#fff6d0 10%,#ffd23f 45%,#ff7a2a 55%,#ff4fa3 95%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #2a0f45;filter:drop-shadow(0 2px 0 #2a0f45)}
.lrow.big .tile{width:46px;height:58px;font-size:38px;border-color:#ff4fa3;box-shadow:0 4px 0 #8a1d55,inset 0 0 12px rgba(255,210,63,.35)}
.tile::after{content:'';position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite;animation-delay:calc(var(--i)*.08s)}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.lsub{font-size:13px;font-weight:800;letter-spacing:6px;color:#ff9ad5;margin-top:2px}
#intro{position:absolute;inset:0;z-index:9;background:radial-gradient(circle at 50% 40%,#3a1466,#0c0620 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#intro.out{opacity:0;pointer-events:none}
.machine{position:relative;padding:18px 12px 16px;border-radius:18px;background:linear-gradient(#ff4fa3,#b3246d);border:4px solid #ffd23f;box-shadow:0 8px 0 #6a1f4a,0 0 40px rgba(255,79,163,.45)}
.machine .lights{position:absolute;inset:4px;border-radius:14px;pointer-events:none;background:radial-gradient(circle,#fff6a0 2px,transparent 3px) 0 0/16px 16px;opacity:.6;animation:chase .6s steps(2) infinite}
.machine.win .lights{animation-duration:.12s;opacity:1}
.machine.win{animation:jolt .35s 2}
@keyframes chase{50%{background-position:8px 0}}
@keyframes jolt{25%{transform:translate(-4px,2px) rotate(-1deg)}75%{transform:translate(4px,-2px) rotate(1deg)}}
.machine .lrow{margin:5px 0;justify-content:center}
.reel{position:relative;width:34px;height:48px;border-radius:7px;background:#0c0820;border:2px solid #2a1650;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Bungee',system-ui,sans-serif;font-size:26px;color:#9a8fd0}
.machine .lrow.big .reel{width:44px;height:58px;font-size:34px}
.reel.spin span{animation:blur .08s infinite}
@keyframes blur{50%{transform:translateY(-6px);opacity:.6}}
.reel.stop{border-color:#ffd23f;background:linear-gradient(#2a1650,#120a24)}
.reel.stop span{background:linear-gradient(#fff6d0 10%,#ffd23f 45%,#ff7a2a 55%,#ff4fa3 95%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #2a0f45;animation:land .3s}
@keyframes land{0%{transform:translateY(-30px) scale(1.4)}60%{transform:translateY(4px) scale(.95)}100%{transform:none}}
.introtap{font-family:'Bungee',system-ui,sans-serif;font-size:12px;color:#b9aee0;letter-spacing:2px}
.introflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.introflash.go{animation:iflash .5s}
@keyframes iflash{0%{opacity:.9}100%{opacity:0}}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:340px}
.pjob{display:flex;flex-direction:column;align-items:center;gap:2px;background:#241a45;border:2px solid #4a3a80;border-radius:10px;padding:6px;font-size:12px}
.pjob.sel{border-color:#7ff6ff;box-shadow:0 0 0 3px rgba(127,246,255,.3)}
.pjob .ic canvas{width:40px;height:40px;image-rendering:pixelated}.pjob small{display:block;color:#b9aee0}
.tip{font-size:12px;color:#b9aee0;line-height:1.5;max-width:320px}
.curses{font-size:15px;line-height:1.7;background:rgba(120,40,160,.35);border:2px solid #9b59ff;border-radius:10px;padding:8px 14px}
#hudBtns{position:absolute;top:8px;right:8px;display:flex;gap:5px;z-index:5}
#hudBtns button{background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.35);border-radius:8px;font-size:12px;font-weight:800;padding:6px 8px;min-height:34px}
#hudBtns button.on{background:#ff4fa3;border-color:#ff9ad5}
#rushBtn{position:absolute;right:10px;bottom:20%;z-index:4;background:#ff4fa3;border:3px solid #fff;border-radius:50%;width:84px;height:84px;font-size:15px;font-weight:900;line-height:1.1;box-shadow:0 0 0 6px rgba(255,79,163,.35),0 6px 0 #8a1d55;animation:pulse .6s infinite alternate}
#rg{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(20,0,30,.45);touch-action:none;cursor:pointer}
.rpanel{width:min(320px,88%);background:#1d1238;border:3px solid #ff4fa3;border-radius:14px;padding:16px;text-align:center;box-shadow:0 0 0 6px rgba(255,79,163,.25)}
.rttl{font-size:22px;font-weight:900;color:#ff9ad5}.rcnt{font-size:14px;font-weight:800;color:#ffd23f;margin:4px 0 12px}
.track{position:relative;height:34px;background:#0c0820;border-radius:17px;overflow:hidden;border:2px solid #4a3a80}
.zone{position:absolute;top:0;bottom:0;background:rgba(255,79,163,.55)}.pz{position:absolute;top:0;bottom:0;background:#ffd23f}
.cur{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 8px #fff}
.rmsg{font-size:20px;font-weight:900;min-height:30px;margin-top:12px;color:#efe8ff}.rmsg.perfect{color:#ffd23f}.rmsg.good{color:#ff9ad5}.rmsg.miss{color:#9a90b8}
